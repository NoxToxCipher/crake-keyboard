[package]
name = "crake-privacy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hardened privacy engine for Crake Keyboard"

[dependencies]
crake-core = { path = "../crake-core" }
zeroize.workspace = true
thiserror.workspace = true
chacha20poly1305.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
rand.workspace = true
boreal.workspace = true
uniffi = { version = "0.28", features = ["cli"], optional = true }
qrcode = { version = "0.14.1", default-features = false }

[features]
default = []
uniffi-bindings = ["dep:uniffi", "crake-core/uniffi-bindings"]

[dev-dependencies]
proptest.workspace = true
