[package]
name = "crake-privacy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hardened privacy engine for Crake Keyboard (URL tracker scrubbing, ephemeral zeroize memory, 5-layer FFI defense)"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "crake_privacy"

[dependencies]
floris-core = { path = "../floris-core" }
zeroize.workspace = true
thiserror.workspace = true
uniffi = { version = "0.28", features = ["cli"], optional = true }

[features]
default = []
uniffi-bindings = ["dep:uniffi", "floris-core/uniffi-bindings"]

[dev-dependencies]
proptest.workspace = true
