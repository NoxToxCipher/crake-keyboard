[workspace]
members = [
    "crates/floris-core",
    "crates/crake-privacy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Crake Project <https://github.com/NoxToxCipher>"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
