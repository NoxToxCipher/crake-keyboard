[workspace]
members = [
    "crates/floris-core",
    "crates/crake-privacy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Crake Project <https://github.com/NoxToxCipher>"]
license = "Apache-2.0"

[workspace.dependencies]
unicode-segmentation = "1.11"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
proptest = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
