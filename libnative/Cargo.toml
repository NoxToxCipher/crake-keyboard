[workspace]
members = [
    "crates/floris-core",
    "crates/crake-privacy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Crake Project <https://github.com/NoxToxCipher>"]
license = "Apache-2.0"

[workspace.dependencies]
unicode-segmentation = "1.11"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
rand = "0.8"
boreal = { version = "0.9", default-features = false }
proptest = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
