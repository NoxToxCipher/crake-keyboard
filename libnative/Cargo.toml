[workspace]
members = [
    "crates/floris-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FlorisBoard Contributors <https://github.com/florisboard>"]
license = "Apache-2.0"

[workspace.dependencies]
unicode-segmentation = "1.11"
thiserror = "1.0"
proptest = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
